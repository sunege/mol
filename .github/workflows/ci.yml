name: CI

on:
  push:
    branches: [main]
  pull_request:

# The WASM artifact is committed to the repository so Vercel only has to run
# Vite: its build image has no Rust toolchain.
#
# The artifact that ships is the one built here, on Linux. A build on a Mac is
# the same program - same code, same strings, same results to the last digit -
# but its data section is laid out in a different order (most likely because
# the per-crate hashes cargo derives differ between host platforms), so its
# bytes never match this one. So the wasm job rebuilds on every push to main
# and every pull request and commits the result wherever it differs, rather
# than failing the check.
#
# The Rust version (rust-toolchain.toml) and the wasm-pack version (which
# decides wasm-opt's) are pinned so that two Linux builds do match, and
# scripts/build-wasm.sh keeps the builder's home directory out of the binary.
# Bump the versions together.
#
# A push made with GITHUB_TOKEN starts no new workflow run, so the refreshing
# commit is not checked again; it changes nothing but web/src/wasm.
permissions:
  contents: write

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: wasm-pack build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is otherwise checked out as a detached merge commit;
          # the branch itself is what a refreshed artifact can be pushed to.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - run: npm run build:wasm

      # Whatever was committed - a Mac build, or one from before the last
      # change to the Rust source - is replaced by this build, on main and on a
      # pull request's branch alike.
      - name: Commit refreshed artifact
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- web/src/wasm; then
            echo "Artifact already up to date."
            exit 0
          fi
          git diff --stat -- web/src/wasm
          # The token cannot push to a fork, so there the only thing left to
          # do is to say so.
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "web/src/wasm differs from the Linux build, and a fork cannot be updated from here." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/wasm
          git commit -m "chore: rebuild WASM artifact"
          git push

  web:
    name: build + test web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test --workspace web -- --run
