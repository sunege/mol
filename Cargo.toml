[workspace]
members = ["crates/dft-core", "crates/dft-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The integral, grid and SCF tests do real numerical work: unoptimised they take
# minutes rather than seconds.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
