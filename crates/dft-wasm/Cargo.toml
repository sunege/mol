[package]
name = "dft-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bridge between the browser worker and dft-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dft-core = { path = "../dft-core" }
wasm-bindgen = "0.2"
# Only for `Date::now`: the engine takes a wall-clock budget as a closure
# because `std::time` does not exist on wasm32-unknown-unknown.
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]

# `wasm-pack build --profiling` keeps function names (-g), so a CPU profile of
# the WebAssembly (node --cpu-prof, or the browser's profiler) says which Rust
# function the time went to. The procedure is in docs/dev-notes.md
# ("コマンドの詳細").
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O3", "--enable-simd", "-g"]
