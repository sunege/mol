[package]
name = "dft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Molecular DFT engine (integrals, SCF, gradients) targeting small non-periodic systems"

[dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[dev-dependencies]
approx = "0.5"
# Reference values generated by scripts/gen_reference.py are read from JSON in
# the integration tests; the engine itself has no serde dependency.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
