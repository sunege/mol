# The committed WebAssembly artifact is rebuilt by CI and replaced whenever its
# bytes differ, and the standard library's paths inside it carry the rustc
# version: an unpinned toolchain would make every CI run after a Rust release
# commit a new artifact. Change this together with the version in
# .github/workflows/ci.yml, and rebuild the artifact.
[toolchain]
channel = "1.98.1"
targets = ["wasm32-unknown-unknown"]
